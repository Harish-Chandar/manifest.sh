# ~/.config/starship.toml

add_newline = true 

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

# prompt_order = [
#   "character",
#   "directory",
#   "git_branch"
# ]

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 5
style = "bold cyan"

[git_branch]
symbol = "[ ](bold magenta)"

[cmd_duration]
disabled = true

[package]
disabled = true

